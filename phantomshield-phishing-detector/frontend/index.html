<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PhantomShield | SOC Enterprise Threat Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #05070f;
            --bg-surface: rgba(10, 18, 30, 0.75);
            --bg-elevated: rgba(15, 25, 45, 0.85);
            --border-dim: rgba(6, 182, 212, 0.15);
            --border-glow: rgba(6, 182, 212, 0.5);
            --text-primary: #f0f4ff;
            --text-secondary: #9aabcc;
            --text-tertiary: #5f739b;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-glow: rgba(6, 182, 212, 0.3);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.25);
            --warning: #f59e0b;
            --safe: #10b981;
        }

        body {
            background: var(--bg-deep);
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            position: relative;
        }

        /* === CINEMATIC ANIMATED BACKGROUND === */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .gradient-mesh {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 40%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 80% 60%, rgba(139, 92, 246, 0.06) 0%, transparent 45%),
                        radial-gradient(circle at 40% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            animation: slowDrift 25s ease-in-out infinite alternate;
        }

        @keyframes slowDrift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-5%, -5%) scale(1.1); }
        }

        .cyber-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(2px 2px at 20px 30px, rgba(6, 182, 212, 0.4), transparent),
                              radial-gradient(1px 1px at 80px 150px, rgba(59, 130, 246, 0.3), transparent);
            background-size: 200px 200px, 300px 300px;
            background-repeat: repeat;
            animation: particleFloat 40s linear infinite;
            opacity: 0.4;
        }

        @keyframes particleFloat {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 400px 400px, -300px 300px; }
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            animation: scanMove 8s linear infinite;
            opacity: 0.6;
            pointer-events: none;
            z-index: 3;
        }

        @keyframes scanMove {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,0.05), rgba(0,0,0,0.05) 1px, transparent 1px, transparent 8px);
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
        }

        .app-container {
            position: relative;
            z-index: 10;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Glassmorphism Base */
        .glass-panel {
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-dim);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(6, 182, 212, 0.05);
        }

        /* Header Premium */
        .premium-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0 1.25rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* PREMIUM ANIMATED LOGO */
        .logo-icon {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.3));
            animation: pulseGlow 3s ease-in-out infinite;
        }

        .logo-icon:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 18px rgba(6, 182, 212, 0.6));
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.4)); }
            50% { filter: drop-shadow(0 0 16px rgba(6, 182, 212, 0.7)); }
        }

        .phantom-logo {
            width: 100%;
            height: 100%;
            display: block;
        }

        .logo-text h1 {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text p {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(6, 182, 212, 0.1);
            padding: 0.5rem 1.3rem;
            border-radius: 40px;
            border: 1px solid var(--accent-cyan);
            backdrop-filter: blur(8px);
        }

        .status-led {
            width: 10px;
            height: 10px;
            background: var(--safe);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--safe);
            animation: ledPulse 1.5s ease-in-out infinite;
        }

        @keyframes ledPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Input Card */
        .input-card-premium {
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-dim);
            border-radius: 28px;
            padding: 1.75rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .input-card-premium:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2), 0 12px 40px rgba(0,0,0,0.4);
        }

        .input-flex {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .url-input-premium {
            flex: 1;
            background: rgba(5, 7, 15, 0.8);
            border: 1px solid var(--border-dim);
            border-radius: 18px;
            padding: 0.9rem 1.2rem;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .url-input-premium:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-primary-premium {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border: none;
            border-radius: 18px;
            padding: 0 2rem;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            position: relative;
            overflow: hidden;
        }

        .btn-primary-premium::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary-premium:hover::before {
            left: 100%;
        }

        .btn-primary-premium:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px var(--accent-glow);
        }

        .btn-secondary-premium {
            background: transparent;
            border: 1px solid var(--border-dim);
            border-radius: 18px;
            padding: 0 1.5rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary-premium:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Result Panel */
        .result-panel-premium {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-dim);
            border-radius: 28px;
            overflow: hidden;
            animation: slideUpFade 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Verdict Header */
        .verdict-premium {
            display: flex;
            align-items: center;
            gap: 1.8rem;
            padding: 1.8rem 2rem;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.08), rgba(139, 92, 246, 0.04));
            border-bottom: 1px solid var(--border-dim);
            flex-wrap: wrap;
        }

        .verdict-icon-animated {
            font-size: 2.8rem;
            transition: transform 0.2s;
            animation: iconGlow 2s ease-in-out infinite;
        }

        @keyframes iconGlow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(6,182,212,0.5)); }
            50% { filter: drop-shadow(0 0 15px rgba(6,182,212,0.8)); }
        }

        /* Gauge Premium */
        .gauge-premium {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .gauge-fill-premium {
            transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Tabs */
        .tabs-premium {
            display: flex;
            gap: 0.25rem;
            padding: 0 1.8rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-dim);
            overflow-x: auto;
        }

        .tab-premium {
            background: none;
            border: none;
            padding: 1rem 1.4rem;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            position: relative;
        }

        .tab-premium.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
            text-shadow: 0 0 8px var(--accent-cyan);
        }

        .tab-premium:hover:not(.active) {
            color: var(--text-secondary);
        }

        .tab-pane-premium {
            display: none;
            padding: 2rem;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-pane-premium.active-pane {
            display: block;
        }

        /* Info Cards */
        .info-grid-premium {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .info-card-premium {
            background: rgba(5, 7, 15, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-dim);
            border-radius: 20px;
            padding: 1rem 1.2rem;
            transition: all 0.2s;
        }

        .info-card-premium:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .info-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-tertiary);
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .info-value {
            font-weight: 500;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* AI Intelligence Panel */
        .ai-premium {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.12), rgba(139, 92, 246, 0.06));
            border: 1px solid var(--accent-cyan);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 0 30px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }

        .ai-premium::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(6,182,212,0.1), transparent);
            animation: rotateGlow 12s linear infinite;
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .typing-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-secondary);
            border-left: 2px solid var(--accent-cyan);
            padding-left: 1rem;
            position: relative;
            z-index: 1;
        }

        /* Evidence Chips */
        .chip-premium {
            display: inline-block;
            background: rgba(239, 68, 68, 0.15);
            border-left: 3px solid var(--danger);
            padding: 0.4rem 1rem;
            margin: 0.25rem 0.5rem;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: monospace;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .chip-warning {
            border-left-color: var(--warning);
            background: rgba(245, 158, 11, 0.12);
        }

        /* Signal Counter */
        .signal-premium {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0,0,0,0.4);
            padding: 0.5rem 1rem;
            border-radius: 40px;
        }

        /* Loading Animation */
        .loader-premium {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-premium {
            background: rgba(239, 68, 68, 0.15);
            border-left: 3px solid var(--danger);
            padding: 0.75rem 1rem;
            margin-top: 1rem;
            border-radius: 12px;
            animation: shake 0.3s ease;
            display: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .recent-table {
            width: 100%;
            border-collapse: collapse;
        }

        .recent-table th {
            text-align: left;
            padding: 0.75rem 0;
            color: var(--text-tertiary);
            font-size: 0.65rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-dim);
        }

        .recent-table td {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-dim);
            font-size: 0.75rem;
        }

        footer {
            margin-top: 3rem;
            padding: 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            border-top: 1px solid var(--border-dim);
        }

        @media (max-width: 800px) {
            .app-container { padding: 0 1rem; }
            .verdict-premium { flex-direction: column; align-items: flex-start; }
            .tabs-premium { padding: 0 0.5rem; }
        }
    </style>
</head>
<body>
<div class="bg-canvas">
    <div class="gradient-mesh"></div>
    <div class="cyber-particles"></div>
    <div class="noise-overlay"></div>
</div>
<div class="scan-line"></div>

<div class="app-container">
    <div class="premium-header">
        <div class="logo-section">
            <!-- PREMIUM ANIMATED SVG LOGO -->
            <div class="logo-icon">
                <svg class="phantom-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(45)">
                            <stop offset="0%" stop-color="#06b6d4">
                                <animate attributeName="stop-color" values="#06b6d4;#8b5cf6;#3b82f6;#06b6d4" dur="6s" repeatCount="indefinite" />
                            </stop>
                            <stop offset="50%" stop-color="#3b82f6">
                                <animate attributeName="stop-color" values="#3b82f6;#06b6d4;#8b5cf6;#3b82f6" dur="6s" repeatCount="indefinite" />
                            </stop>
                            <stop offset="100%" stop-color="#8b5cf6">
                                <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#06b6d4;#8b5cf6" dur="6s" repeatCount="indefinite" />
                            </stop>
                        </linearGradient>
                        <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
                            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2" />
                            <feMerge>
                                <feMergeNode in="blur2" />
                                <feMergeNode in="blur1" />
                                <feMergeNode in="SourceGraphic" />
                            </feMerge>
                        </filter>
                        <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
                            <stop offset="40%" stop-color="rgba(255,255,255,0)" />
                            <stop offset="50%" stop-color="rgba(255,255,255,0.7)" />
                            <stop offset="60%" stop-color="rgba(255,255,255,0)" />
                            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                            <animateTransform attributeName="gradientTransform" type="translate" from="-1 -1" to="2 2" dur="4s" repeatCount="indefinite" />
                        </linearGradient>
                    </defs>
                    <path d="M50 5 L85 18 L85 48 C85 72 70 88 50 95 C30 88 15 72 15 48 L15 18 L50 5 Z" fill="url(#shieldGrad)" stroke="rgba(6,182,212,0.6)" stroke-width="1.5" filter="url(#neonGlow)" opacity="0.95" />
                    <path d="M50 15 L75 25 L75 48 C75 67 64 81 50 86 C36 81 25 67 25 48 L25 25 L50 15 Z" fill="rgba(5,7,15,0.6)" stroke="url(#shieldGrad)" stroke-width="1.2" />
                    <circle cx="50" cy="32" r="4" fill="#06b6d4" filter="url(#neonGlow)">
                        <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="38" cy="45" r="3" fill="#3b82f6" filter="url(#neonGlow)">
                        <animate attributeName="r" values="2.5;4;2.5" dur="2.5s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="62" cy="45" r="3" fill="#8b5cf6" filter="url(#neonGlow)">
                        <animate attributeName="r" values="2.5;4;2.5" dur="2.8s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="50" cy="58" r="3.5" fill="#06b6d4" filter="url(#neonGlow)">
                        <animate attributeName="r" values="3;4.5;3" dur="2.2s" repeatCount="indefinite" />
                    </circle>
                    <line x1="50" y1="32" x2="38" y2="45" stroke="rgba(6,182,212,0.4)" stroke-width="1" stroke-dasharray="3 2">
                        <animate attributeName="stroke-dashoffset" values="0;10" dur="1s" repeatCount="indefinite" />
                    </line>
                    <line x1="50" y1="32" x2="62" y2="45" stroke="rgba(6,182,212,0.4)" stroke-width="1" stroke-dasharray="3 2">
                        <animate attributeName="stroke-dashoffset" values="0;10" dur="1.2s" repeatCount="indefinite" />
                    </line>
                    <circle cx="50" cy="50" r="8" fill="none" stroke="url(#shieldGrad)" stroke-width="1.5" opacity="0.8">
                        <animate attributeName="r" values="7;9;7" dur="3s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="50" cy="50" r="3" fill="#06b6d4" filter="url(#neonGlow)">
                        <animate attributeName="r" values="2.5;3.5;2.5" dur="2s" repeatCount="indefinite" />
                    </circle>
                    <path d="M50 5 L85 18 L85 48 C85 72 70 88 50 95 C30 88 15 72 15 48 L15 18 L50 5 Z" fill="url(#shimmer)" opacity="0" />
                </svg>
            </div>
            <div class="logo-text">
                <h1>PhantomShield</h1>
                <p>ENTERPRISE THREAT INTELLIGENCE</p>
            </div>
        </div>
        <div class="status-badge">
            <div class="status-led"></div>
            <span>ACTIVE · REAL-TIME</span>
        </div>
    </div>

    <div class="input-card-premium">
        <div class="input-flex">
            <input type="text" id="urlInput" class="url-input-premium" placeholder="https:// or domain.com" autocomplete="off">
            <button id="analyzeBtn" class="btn-primary-premium"><i class="fas fa-radar"></i> Run Threat Scan</button>
            <button id="resetBtn" class="btn-secondary-premium"><i class="fas fa-undo-alt"></i> Reset</button>
        </div>
        <div id="inputError" class="error-premium"></div>
    </div>

    <div id="resultContainer" style="display: none;">
        <div class="result-panel-premium">
            <div id="verdictBlock" class="verdict-premium">
                <div class="verdict-icon-animated" id="verdictIcon"><i class="fas fa-shield-alt"></i></div>
                <div class="verdict-text-premium">
                    <div class="verdict-label-premium" id="verdictLabel" style="font-size:1.6rem; font-weight:800;">—</div>
                    <div style="font-size:0.7rem; color: var(--text-tertiary);" id="confidenceText">Confidence: —</div>
                </div>
                <div class="gauge-premium">
                    <svg viewBox="0 0 100 100" width="120" height="120">
                        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(6,182,212,0.2)" stroke-width="8" />
                        <circle id="gaugeFill" cx="50" cy="50" r="42" fill="none" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="263.8" stroke-dashoffset="263.8" transform="rotate(-90 50 50)" />
                        <defs>
                            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#06b6d4" />
                                <stop offset="100%" stop-color="#8b5cf6" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;">
                        <span id="riskScoreValue" style="font-size:1.6rem; font-weight:800;">0</span>
                        <span style="font-size:0.6rem;">THREAT</span>
                    </div>
                </div>
            </div>

            <div style="padding: 0.8rem 2rem; display: flex; gap: 1.5rem; flex-wrap: wrap; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border-dim);">
                <span><i class="fas fa-globe"></i> <strong id="domainField">—</strong></span>
                <span><i class="fas fa-network-wired"></i> <strong id="ipField">—</strong></span>
                <span><i class="fas fa-link"></i> <span id="urlFieldShort">—</span></span>
            </div>

            <div style="padding: 1rem 2rem 0 2rem;">
                <div class="signal-premium">
                    <i class="fas fa-waveform"></i> DETECTION SIGNALS: <strong id="signalCount">0</strong> TRIGGERED
                </div>
            </div>

            <div class="tabs-premium" id="tabsNav">
                <button class="tab-premium active" data-tab="overview">Overview</button>
                <button class="tab-premium" data-tab="urlsignals">URL Signals</button>
                <button class="tab-premium" data-tab="domainintel">Domain Intel</button>
                <button class="tab-premium" data-tab="pageanalysis">Page Analysis</button>
                <button class="tab-premium" data-tab="evidence">Evidence</button>
                <button class="tab-premium" data-tab="aireasoning">AI Reasoning</button>
                <button class="tab-premium" data-tab="recent">Recent Scans</button>
            </div>

            <div class="tab-content">
                <div id="overviewPane" class="tab-pane-premium active-pane"><div class="info-grid-premium" id="overviewGrid"></div></div>
                <div id="urlsignalsPane" class="tab-pane-premium"><div class="info-grid-premium" id="urlSignalsGrid"></div></div>
                <div id="domainintelPane" class="tab-pane-premium"><div class="info-grid-premium" id="domainIntelGrid"></div></div>
                <div id="pageanalysisPane" class="tab-pane-premium"><div class="info-grid-premium" id="pageAnalysisGrid"></div></div>
                <div id="evidencePane" class="tab-pane-premium"><div id="evidenceContainer" style="display: flex; flex-wrap: wrap; gap: 0.6rem;"></div></div>
                <div id="aireasoningPane" class="tab-pane-premium">
                    <div class="ai-premium">
                        <div style="font-weight:800; margin-bottom:1rem; letter-spacing:1px;"><i class="fas fa-microchip"></i> CLASSIFIED AI INTELLIGENCE REPORT</div>
                        <div id="aiExplanation" class="typing-text">Loading analysis...</div>
                    </div>
                </div>
                <div id="recentPane" class="tab-pane-premium">
                    <table class="recent-table">
                        <thead><tr><th>Target URL</th><th>Verdict</th><th>Score</th></tr></thead>
                        <tbody id="recentTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <footer>© PhantomShield — Advanced SOC Threat Intelligence Core | Real-time Heuristic Analysis</footer>
</div>

<script>
    let currentData = null;
    let recentScans = [];
    const circumference = 2 * Math.PI * 42;

    const urlInput = document.getElementById('urlInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const inputError = document.getElementById('inputError');
    const resultContainer = document.getElementById('resultContainer');
    const gaugeFill = document.getElementById('gaugeFill');
    const riskScoreValue = document.getElementById('riskScoreValue');
    const verdictLabel = document.getElementById('verdictLabel');
    const confidenceText = document.getElementById('confidenceText');
    const domainField = document.getElementById('domainField');
    const ipField = document.getElementById('ipField');
    const urlFieldShort = document.getElementById('urlFieldShort');
    const signalCountSpan = document.getElementById('signalCount');
    const aiExplanation = document.getElementById('aiExplanation');

    function updateVerdictUI(verdict, risk_score, confidence) {
        let color, iconHtml;
        if (verdict === 'High Confidence Phishing') {
            color = '#ef4444'; iconHtml = '<i class="fas fa-skull-crosswalk" style="font-size:2.8rem; color:#ef4444;"></i>';
        } else if (verdict === 'Likely Phishing') {
            color = '#f97316'; iconHtml = '<i class="fas fa-triangle-exclamation" style="font-size:2.8rem; color:#f97316;"></i>';
        } else if (verdict === 'Suspicious') {
            color = '#f5a623'; iconHtml = '<i class="fas fa-exclamation-triangle" style="font-size:2.8rem; color:#f5a623;"></i>';
        } else if (verdict === 'Likely Safe') {
            color = '#10b981'; iconHtml = '<i class="fas fa-shield-check" style="font-size:2.8rem; color:#10b981;"></i>';
        } else {
            color = '#6c86a3'; iconHtml = '<i class="fas fa-question-circle" style="font-size:2.8rem;"></i>';
        }
        document.getElementById('verdictIcon').innerHTML = iconHtml;
        verdictLabel.style.color = color;
        verdictLabel.innerText = verdict.toUpperCase();
        confidenceText.innerText = `Confidence: ${confidence || 'N/A'}`;
        const offset = circumference - (risk_score / 100) * circumference;
        gaugeFill.style.strokeDashoffset = offset;
        riskScoreValue.innerText = risk_score;
    }

    function typeWriterEffect(element, text, speed = 15) {
        element.innerHTML = '';
        let i = 0;
        function type() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
            }
        }
        type();
    }

    function updateUI(data) {
        currentData = data;
        const { verdict, risk_score, url, ip, domain, confidence, ai_explanation, reasons, features, page_analysis, domain_age_days } = data;
        
        updateVerdictUI(verdict, risk_score, confidence);
        domainField.innerText = domain || 'unknown';
        ipField.innerText = ip || 'N/A';
        urlFieldShort.innerText = url && url.length > 55 ? url.substr(0, 52)+'...' : url;
        typeWriterEffect(aiExplanation, ai_explanation || 'No AI-generated summary available from the detection engine.', 15);

        const overviewItems = [
            { label: "Final Verdict", value: verdict },
            { label: "Risk Classification", value: risk_score >= 75 ? 'Critical' : (risk_score >= 45 ? 'High' : (risk_score >= 20 ? 'Medium' : 'Low')) },
            { label: "SSL/TLS", value: features?.https === 1 ? "Encrypted" : "Insecure" },
            { label: "Login Form", value: page_analysis?.has_login_form === 1 ? "Detected" : "None" },
            { label: "External Form Action", value: page_analysis?.external_form_action === 1 ? "Cross-domain" : "Same-origin" },
            { label: "Domain Age", value: domain_age_days ? `${domain_age_days} days` : "Unknown" }
        ];
        document.getElementById('overviewGrid').innerHTML = overviewItems.map(i => `<div class="info-card-premium"><div class="info-label">${i.label}</div><div class="info-value">${i.value}</div></div>`).join('');

        let sigCount = 0;
        if (features?.https === 0) sigCount++;
        if (features?.has_ip === 1) sigCount++;
        if (features?.at_symbol === 1) sigCount++;
        if (page_analysis?.external_form_action === 1) sigCount++;
        if (page_analysis?.has_password_field === 1) sigCount++;
        if (features?.double_slash_redirect === 1) sigCount++;
        if (reasons && reasons.length) sigCount += reasons.length;
        signalCountSpan.innerText = sigCount;

        const urlSignals = [
            { label: "URL Length", value: features?.url_length ?? 'N/A' },
            { label: "SSL/TLS", value: features?.https === 1 ? "Valid" : "Plaintext" },
            { label: "Dots Count", value: features?.dot_count ?? '—' },
            { label: "@ Symbol", value: features?.at_symbol === 1 ? "Present" : "Absent" },
            { label: "Double Slash", value: features?.double_slash_redirect === 1 ? "Redirect risk" : "Clean" },
            { label: "IP Host", value: features?.has_ip === 1 ? "IP address" : "Domain" },
            { label: "High Risk TLD", value: features?.high_risk_tld === 1 ? "Yes" : "No" }
        ];
        document.getElementById('urlSignalsGrid').innerHTML = urlSignals.map(s => `<div class="info-card-premium"><div class="info-label">${s.label}</div><div class="info-value">${s.value ?? '—'}</div></div>`).join('');

        const domainIntel = [
            { label: "Hostname", value: domain || '—' },
            { label: "IP Address", value: ip || '—' },
            { label: "Domain Age", value: domain_age_days ? `${domain_age_days} days` : "Unknown" },
            { label: "TLD", value: data.tld || '—' }
        ];
        document.getElementById('domainIntelGrid').innerHTML = domainIntel.map(d => `<div class="info-card-premium"><div class="info-label">${d.label}</div><div class="info-value">${d.value}</div></div>`).join('');

        const pa = page_analysis || {};
        const pageItems = [
            { label: "HTTP Status", value: pa.status_code ?? '—' },
            { label: "Page Title", value: pa.page_title || 'No title' },
            { label: "Login Form", value: pa.has_login_form === 1 ? "Present" : "Absent" },
            { label: "Password Field", value: pa.has_password_field === 1 ? "Detected" : "None" },
            { label: "External Action", value: pa.external_form_action === 1 ? "Yes (exfiltration)" : "No" }
        ];
        document.getElementById('pageAnalysisGrid').innerHTML = pageItems.map(p => `<div class="info-card-premium"><div class="info-label">${p.label}</div><div class="info-value">${p.value}</div></div>`).join('');

        const evidenceDiv = document.getElementById('evidenceContainer');
        let evidenceItems = [];
        if (reasons && reasons.length) reasons.forEach(r => evidenceItems.push({ text: r, type: 'danger' }));
        if (features?.https === 0) evidenceItems.push({ text: "[NO HTTPS] Unencrypted channel", type: 'warning' });
        if (pa.external_form_action === 1) evidenceItems.push({ text: "[DATA LEAK] External form submit", type: 'danger' });
        if (features?.has_ip === 1) evidenceItems.push({ text: "[IP DIRECT] Bypasses reputation", type: 'warning' });
        if (pa.has_login_form === 1 && pa.has_password_field === 1) evidenceItems.push({ text: "[CREDENTIAL CATCHER] Login+password", type: 'danger' });
        if (!evidenceItems.length) evidenceItems.push({ text: "[CLEAR] No threats detected", type: 'safe' });
        evidenceDiv.innerHTML = evidenceItems.map(e => `<span class="chip-premium ${e.type === 'warning' ? 'chip-warning' : ''}"><i class="fas fa-bug"></i> ${e.text}</span>`).join('');

        recentScans.unshift({ url, verdict, risk_score });
        if (recentScans.length > 7) recentScans.pop();
        const tbody = document.getElementById('recentTableBody');
        tbody.innerHTML = recentScans.map(s => {
            let color = s.verdict === 'Likely Safe' ? '#10b981' : (s.verdict === 'Suspicious' ? '#f5a623' : (s.verdict.includes('Phishing') ? '#ef4444' : '#f97316'));
            return `<tr><td style="max-width:200px; overflow:hidden; text-overflow:ellipsis;">${s.url}</td><td style="color:${color};">${s.verdict}</td><td>${s.risk_score}</td></tr>`;
        }).join('');
    }

    async function performAnalysis() {
        const rawUrl = urlInput.value.trim();
        if (!rawUrl) {
            inputError.style.display = 'block';
            inputError.innerText = 'Enter a valid target URL.';
            return;
        }
        inputError.style.display = 'none';
        analyzeBtn.disabled = true;
        const originalHtml = analyzeBtn.innerHTML;
        analyzeBtn.innerHTML = '<span class="loader-premium"></span> SCANNING TARGET...';
        
        try {
            const response = await fetch('http://127.0.0.1:8000/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: rawUrl })
            });
            if (!response.ok) throw new Error(`API error (${response.status})`);
            const data = await response.json();
            resultContainer.style.display = 'block';
            updateUI(data);
            document.querySelectorAll('.tab-premium').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.tab-premium[data-tab="overview"]').classList.add('active');
            document.querySelectorAll('.tab-pane-premium').forEach(p => p.classList.remove('active-pane'));
            document.getElementById('overviewPane').classList.add('active-pane');
        } catch (err) {
            inputError.style.display = 'block';
            inputError.innerText = `Connection error: ${err.message}. Ensure backend runs on port 8000.`;
            resultContainer.style.display = 'none';
        } finally {
            analyzeBtn.disabled = false;
            analyzeBtn.innerHTML = originalHtml;
        }
    }

    function resetForm() {
        urlInput.value = '';
        resultContainer.style.display = 'none';
        inputError.style.display = 'none';
        currentData = null;
        urlInput.focus();
    }

    document.querySelectorAll('.tab-premium').forEach(btn => {
        btn.addEventListener('click', () => {
            const tabId = btn.getAttribute('data-tab');
            document.querySelectorAll('.tab-premium').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-pane-premium').forEach(pane => pane.classList.remove('active-pane'));
            document.getElementById(`${tabId}Pane`).classList.add('active-pane');
        });
    });

    analyzeBtn.addEventListener('click', performAnalysis);
    resetBtn.addEventListener('click', resetForm);
    urlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performAnalysis(); });
</script>
</body>
</html>
